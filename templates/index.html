<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8">
    <title>Zu Bbbearbeiten</title>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/semantic-ui@2.4.2/dist/semantic.min.css">
</head>

<body>

    <div style="margin-top: 50px;" class="ui container">
        <h1 class="ui center aligned header">Zu Bbbearbeiten</h1>
        <div class="ui divider"></div>
    </div>

    <form name="item" class="ui container form" action="/add" method="post">

        <div class="ui pointing below label" style="margin-top: 0.5em">
            Was gibbbt es zu tun?
        </div>

        <input autofocus
            class="ui fluid input focus"
            name="text"
            type="text"
            id="text"
            placeholder="Fürs Modul lernen...">

        <div class="ui pointing below label" style="margin-top: 0.5em">
            Was genau?
        </div>

        <textarea name="description" id="description" rows="2"></textarea>

        <div class="ui pointing below label" style="margin-top: 0.5em">
            Zu welcher Kategorie gehört es?
        </div>

        <select class="ui fluid input" id="category" name="category">
            <option value="Hausaufgaben">Hausaufgaben</option>
            <option value="Kunst">Kunst</option>
            <option value="Hausarbeit">Hausarbeit</option>
            <option value="Musse">Musse</option>
        </select>

        <div class="ui pointing below label" style="margin-top: 1em">
            Wann muss es fertig sein?
        </div>

        <div class="ui fluid input action">
            <input type="date" id="deadline" name="deadline">
            <button class="ui blue button" type="submit">
                Hinzufügen
            </button>
        </div>

    </form>

    <div class="ui container" style="margin-top: 2em">

        {% for item in items %}

        <div class="ui raised segment" style="overflow:hidden; margin-top: 1em">

            <span class="ui black left label">
                <i class="calendar icon"></i>
                {{ item.date.strftime("%d.%m.%Y") }}
            </span>

            <span class="ui black left label">
                <i class="folder open icon"></i>
                {{ item.category }}
            </span>

            <span class="ui header" style="margin-left: 0.5em;">
                {{ item.text }}
            </span>

            <span>
                {{ item.description }}
            </span>

            {% if item.isCompleted %}

            <a class="ui green left corner label" href="/update/{{ item.id }}">
                <i class="check square outline icon"></i>
            </a>

            {% else %}

            <a class="ui red left corner label" href="/update/{{ item.id }}">
                <i class="square outline icon"></i>
            </a>

            {% endif %}

        </div>

        {% endfor %}

        <a href="/getCSV">
            <button class="ui fluid primary button">
                <i class="icon download"></i>
                Download
            </button>
        </a>

    </div>

</body>

</html>
